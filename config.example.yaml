# parsec-market-brief — U.S.-first / global example configuration.
#
# Copy to config.yaml and edit. If config.yaml is absent this file is read
# instead (with a warning), so the monitoring brief works from a fresh clone.

# Market-local time for report dates and schedules. Change this if another
# global market anchors your day.
timezone: "America/New_York"

market_brief:
  enabled: true
  schedule_time: "08:00"      # quote it — unquoted 08:00 is an int in YAML
  max_items: 25
  compose_model: "claude-sonnet-4-6"

  # SEC 13F watcher. The contact address is required in the SEC User-Agent.
  trackers:
    - {name: "Berkshire Hathaway", cik: "0001067983"}
  sec_contact: "you@example.com"

  # U.S. holdings are the centre of the brief. Major global listings use their
  # normal Yahoo Finance exchange suffixes (examples: .L, .DE, .T, .HK, .TO,
  # .AX). One ticker-specific Yahoo news feed is generated for every row.
  watchlist:
    - {symbol: "QQQM", name: "Invesco NASDAQ 100 ETF", aliases: ["Nasdaq 100"], market: us}
    - {symbol: "VTI", name: "Vanguard Total Stock Market ETF", aliases: ["VTI"], market: us}
    - {symbol: "PWR", name: "Quanta Services", aliases: ["Quanta"], market: us}
    - {symbol: "MU", name: "Micron Technology", aliases: ["Micron"], market: us}
    - {symbol: "TSM", name: "Taiwan Semiconductor", aliases: ["TSMC"], market: us}
    - {symbol: "VWRA.L", name: "Vanguard FTSE All-World UCITS ETF", aliases: ["VWRA"], market: global}
    - {symbol: "SAP.DE", name: "SAP", aliases: ["SAP SE"], market: europe, watch_only: true}
    - {symbol: "7203.T", name: "Toyota Motor", aliases: ["Toyota"], market: asia_pacific, watch_only: true}

  macro_keywords:
    - "Federal Reserve"
    - "FOMC"
    - "US inflation"
    - "CPI"
    - "jobs report"
    - "Treasury yield"
    - "VIX"
    - "dollar index"
    - "oil"
    - "ECB"
    - "Bank of Japan"
    - "trade tariff"
    - "semiconductors"
    - "AI infrastructure"

# Separate comprehensive portfolio decision-support report.
#
# It does NOT log in to IBKR and cannot place orders. Use the optional read-only
# Flex Web Service, export an Activity Statement CSV locally, or supply position
# rows. Private portfolio values are never written to the market-brief archive.
portfolio_view:
  enabled: false
  schedule_time: "08:15"
  base_currency: "USD"
  ibkr_flex:
    enabled: false              # when true, reads IBKR_FLEX_TOKEN and
                                # IBKR_FLEX_QUERY_ID from the environment only
  ibkr_csv: ""                  # e.g. "data/ibkr-activity.csv"
  deployable_cash: 0            # cash you explicitly want allocated today
  max_position_pct: 20
  max_sector_pct: 35
  min_buy_score: 3
  max_snapshot_age_days: 3     # stale holdings force HOLD and block deployment

  # Use these metadata rows to classify IBKR Flex/CSV holdings. In Flex mode
  # they are metadata only; otherwise quantity and average_cost can make them
  # standalone positions. Never commit your real private config.yaml.
  positions: []
  # Example (keep commented until replaced with your own data):
  # - symbol: "QQQM"
  #   name: "Invesco NASDAQ 100 ETF"
  #   quantity: 10
  #   average_cost: 210
  #   currency: "USD"
  #   sector: "Diversified"
  #   region: "United States"
  #   asset_class: "ETF"
  #   factors: ["Growth", "Large Cap", "Technology tilt"]
  #   realized_pnl: 0

  # Non-held names evaluated by the same P/E, PEG, growth, trend and
  # concentration screen. These never become holdings automatically.
  research_candidates: []
  # - {symbol: "AVGO", name: "Broadcom", currency: "USD", sector: "Semiconductors", region: "United States", factors: ["AI infrastructure"]}

delivery:
  backend: "console"
  # base_url: "http://localhost:3000"
  # session: "default"
  # chat_id: "000000000000@c.us"
  # Never put a delivery key in this file; read it from the environment.
