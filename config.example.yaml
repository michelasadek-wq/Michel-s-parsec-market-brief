# parsec-market-brief — example configuration.
#
# Copy to config.yaml and edit. If config.yaml is absent this file is read
# instead (with a warning), so a fresh clone runs before it is configured.
#
# MONITORING ONLY — the brief never carries buy/sell/hold calls or price
# targets. The watchlist below says what to WATCH, never what to do about it.

# All dates (dedup TTL, 13F staleness window, the brief's own date) are
# resolved in this timezone — the reader's local time, which is also what
# schedule_times below is written in — not the server's.
timezone: "Asia/Dubai"

market_brief:
  enabled: true

  # When a brief is meant to run, in the timezone above. Nothing in the app
  # schedules anything — point cron / a systemd timer at these times; the
  # config is just the single place the cadence is written down.
  # Quote the values — unquoted 08:00 is an int in YAML.
  schedule_times: ["10:00", "18:00", "23:00"]

  max_items: 25               # cap on headlines carried into one brief

  # Optional narrative composer. Only used when the `claude` CLI is on PATH;
  # without it every run prints the static digest, which is the real output.
  compose_model: "claude-sonnet-4-6"

  # Market-wide radar: the day's biggest US gainers and most-searched tickers,
  # reported as observed activity. Data only — never presented as picks.
  radar_enabled: true
  radar_count: 5

  # Institutional 13F watcher (SEC EDGAR). Quarterly cadence — silent on ~99%
  # of days. sec_contact goes into the User-Agent that SEC requires on every
  # request; requests without one are blocked outright.
  trackers:
    - {name: "Berkshire Hathaway", cik: "0001067983"}
  sec_contact: "you@example.com"

  watchlist:
    # ── Priced entries ──────────────────────────────────────────────
    # Quoted each run, flagged when they move past their threshold (2%, or 1%
    # for the low-beta instruments listed in brief.py).
    - {symbol: "TSM", name: "TSMC", aliases: ["Taiwan Semiconductor"], market: us}
    - {symbol: "AVGO", name: "Broadcom", aliases: ["Broadcom"], market: us}
    - {symbol: "NVDA", name: "NVIDIA", aliases: ["Nvidia"], market: us, watch_only: true}
    - {symbol: "MSFT", name: "Microsoft", aliases: ["Microsoft"], market: us, watch_only: true}
    - {symbol: "VWRA.L", name: "Vanguard FTSE All-World (VWRA)", aliases: ["VWRA"], market: lse}

    # ── News-only entries ───────────────────────────────────────────
    # Tracked in headlines, never priced — for names whose symbol is unverified
    # or unlisted. A WRONG symbol is worse than no symbol: it would print a
    # confident number for a different instrument.
    # - {name: "OpenAI", aliases: ["ChatGPT"], market: us, news_only: true}

  # Macro/policy terms. A headline matching one of these is kept even when it
  # names nothing on the watchlist, but it ranks below ticker-specific news.
  # Matching is whole-token and case-insensitive.
  macro_keywords: ["Federal Reserve", "Fed rate", "Trump tariff", "CPI",
                   "Treasury yields", "executive order", "rate cut", "OPEC"]

# Where a finished brief goes. "console" prints it (the default, and what
# `--once` uses). "whatsapp" targets an HTTP gateway and is a documented stub —
# see market_brief/senders.py before enabling it.
delivery:
  backend: "console"
  # base_url: "http://localhost:3000"
  # session: "default"
  # chat_id: "000000000000@c.us"
  # Never put a key in this file — read it from the environment instead.
